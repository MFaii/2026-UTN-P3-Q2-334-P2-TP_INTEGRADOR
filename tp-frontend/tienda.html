<!doctype html>
<html lang="es">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Catalogo</title>
		<link rel="shortcut icon" href="./img/tecno-store.png"> 
		<link rel="stylesheet" href="css/style.css" />
	</head>
	<body>
		<header class="main-header">
			<div class="logo-container">
				
                <img class="logo" src="./img/tecno-store.png" alt="logo" />
                <h1 id="texto-bienvenida"></h1>
			</div>
			
		</header>

		<h2 id="text-catalogo">Nuestros Productos</h2>

		<main>
			<section id="contenedor-productos" class="catalog-section"></section>
		</main>

		<footer class="main-footer">
			<img src="img/tecno-store.png" alt="Tecno Store" class="footer-logo">
			<p>&copy; 2026 Tienda ficticia. Todos los derechos reservados</p>
		</footer>



		<script>
			const urlBase = "http://localhost:3001";
			const contenedorProductos = document.getElementById("contenedor-productos");

			async function obtenerProductos() {
				try {
					const response = await fetch(`${urlBase}/api/products`);
					console.log(response);

					const data = await response.json();

                    if(!response.ok) {
                        contenedorProductos.innerHTML = ` <p>${data.message}</p>`;
                        return;
                    }

					const productos = data.payload;

					renderizarProducto(productos);
				} catch (error) {
					console.error("Error al obtener productos: ", error);
				}
			}

			function renderizarProducto(array) {
				let htmlProductos = "";

				array.forEach((producto) => {
					htmlProductos += `
                <div class="product-card">
                    <div class="card-img-wrapper">
                        <img class="card-img" src="${producto.image}" alt="${producto.name}">
                    </div>
                    <div class="card-content">
                        <h4>${producto.name}</h4>
                        <p>ID: ${producto.id}</p>
                        <p class="product-price">$ ${producto.price}</p>
                    </div>
                </div>
                `;
				});

				contenedorProductos.innerHTML = htmlProductos;
			}

			const nombreCliente = sessionStorage.getItem("nombre");

			if(!nombreCliente) {
				window.location.replace("index.html");
			} else {
				obtenerProductos();

				const titulo = document.getElementById("texto-bienvenida");
				if (titulo) {
					titulo.textContent = `Bienvenido/a  ${nombreCliente}`;
				}
				
			}
		</script>

	</body>
	
</html>
